name: Manifests

# The only gate this repository can have, and it is worth having: `kustomize build` catches a
# manifest that does not render — a bad digest edit, a resource removed from disk but not from
# the list, a generator that no longer resolves — *before* ArgoCD reports it as a failed sync
# on a branch that is already deployed.
#
# It never applies anything. The cluster is ArgoCD's, and this workflow does not have, or want,
# credentials for it.

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, like every tool in a gate: an unpinned one means the gate can change under a commit
  # that changed nothing.
  KUSTOMIZE_VERSION: '5.7.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize

      - name: The manifests render
        run: kustomize build . > /dev/null

      # A digest is what makes a rollback possible; a moving tag lets two replicas of one
      # Deployment run different code. On `prod` that is not a preference, so the branch that a
      # human merges into is the branch where it is checked.
      #
      # Two ways to not be a digest, and only one of them is a defect. `REPLACED_BY_CI` is the
      # bootstrap value this repository ships with — it means *nothing has ever been released*,
      # it is true the day the branch is created, and no commit can fix it before the first
      # release does. Failing on it made prod permanently red out of the box, which is how a
      # gate teaches people to ignore it. Anything else that is not a digest was put there by a
      # human, and that is the thing worth stopping.
      - name: On prod, every image is pinned to a digest
        if: github.base_ref == 'prod' || github.ref_name == 'prod'
        run: |
          unpinned=$(kustomize build . | sed -n 's/^[[:space:]]*image: //p' | grep -v '@sha256:' || true)
          [ -n "$unpinned" ] || { echo '✓ every image is a digest'; exit 0; }

          moving=$(printf '%s\n' "$unpinned" | grep -v ':REPLACED_BY_CI$' || true)
          if [ -n "$moving" ]; then
            printf '%s\n' "$moving"
            echo '::error::the image(s) above are a moving tag, not a digest. Two replicas of one Deployment can then run different code, and "roll back to what was running" has no answer.'
            exit 1
          fi

          printf '%s\n' "$unpinned"
          echo '::warning::prod has never been released — this is the bootstrap placeholder, not a moving tag. The first release pull request replaces it with a digest, and this warning goes with it.'
