# What ArgoCD reads, on `dev` and on `prod`. One branch per environment, no overlays: with a
# branch per environment an overlay would be a second axis saying the same thing, and the
# question "what is deployed on dev" would have two answers.
#
# The branches differ in exactly three things — the image digests below, the ConfigMap values,
# and the ingress host. Nothing else, ever.
#
# **No `namespace:` here on purpose.** The namespace, and the ArgoCD Application that points at
# this branch, are both owned by the infra repository — the Application's
# `spec.destination.namespace` is the single place the name is written. Repeating it here would
# be a fourth per-branch difference, and a chance for the two to disagree.
#
# The image reference is a digest on both branches. A moving tag means two replicas of one
# Deployment can run different code, and it makes a rollback unspeakable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- api.deployment.yaml
- api.service.yaml
- web.deployment.yaml
- web.service.yaml
- ingress.yaml

  # `REPLACED_BY_CI` is not a placeholder waiting for a human: the first CI run on this branch
  # replaces both with digests. Until then the pods do not pull, loudly, which is the correct
  # answer to "nothing has been built yet".
images:
- digest: sha256:c23a6f59c9be33ebcdd3ef8daa233f2b953fd7a9257047a99c6912d31ad46ca4
  name: ghcr.io/dohr-michael/temper-api
- digest: sha256:e3dd0e6d7824f75f85062f33804fc7be92259ccdddda47a1262bcaa72db0a89c
  name: ghcr.io/dohr-michael/temper-web

# Non-secret configuration, in one place. `configMapGenerator` appends a content hash to the
# name and rewrites the references, so **a config change rolls the pods** — which is the whole
# reason not to write the ConfigMap by hand.
#
# None of these is a credential: an authorization-code + PKCE flow has no client secret, and the
# authority, client id and audience are all visible in the browser's first redirect. The one
# value that does carry one — the MongoDB URI — is not here; it comes from `infra-secrets`.
      # The browser's view of the same provider. Rendered into config.js at boot.
      # Same-origin: the portal reaches the API through spa-server's proxy, so no origin has to
      # be allowed. An empty value is "allow nothing", which is what this needs to be.
configMapGenerator:
- literals:
  - TEMPER_OIDC_ISSUER=https://dohrm.eu.auth0.com/
  - TEMPER_OIDC_AUDIENCE=https://temper.com
  - TEMPER_OIDC_AUTHORITY=https://dohrm.eu.auth0.com
  - TEMPER_OIDC_CLIENT_ID=W0NiUgWHIwK6UR6oAeBywPJqAc8o5l5q
  - TEMPER_CORS_ALLOWED_ORIGINS=
  name: temper
